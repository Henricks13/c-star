services:
  postgres:
    image: postgres:16-alpine
    container_name: cstar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cstar
      POSTGRES_USER: cstar
      POSTGRES_PASSWORD: cstar123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cstar -d cstar"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: cstar-backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/cstar
      DB_USER: cstar
      DB_PASSWORD: cstar123
      JWT_SECRET: change-me-change-me-change-me-change-me-1234567890
      PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: cstar-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
