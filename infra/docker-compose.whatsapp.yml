services:
  evolution-postgres:
    image: postgres:16-alpine
    container_name: cstar-evolution-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=evolution
      - POSTGRES_USER=evolution
      - POSTGRES_PASSWORD=evolution123
    volumes:
      - evolution_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 10s
      timeout: 5s
      retries: 8

  evolution:
    image: atendai/evolution-api:v2.2.3
    container_name: cstar-evolution
    restart: unless-stopped
    depends_on:
      evolution-postgres:
        condition: service_healthy
    ports:
      - "8088:8080"
    environment:
      - SERVER_URL=http://localhost:8088
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-cstar-evolution-key}
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      - CONFIG_SESSION_PHONE_VERSION=2.3000.1034469067
      - LOG_LEVEL=INFO
      - WEBSOCKET_ENABLED=true
      - WEBSOCKET_GLOBAL_EVENTS=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:evolution123@evolution-postgres:5432/evolution?schema=public
      - CACHE_REDIS_ENABLED=false

volumes:
  evolution_postgres_data:
