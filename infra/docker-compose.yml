services:
  postgres:
    image: postgres:16-alpine
    container_name: cstar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cstar
      POSTGRES_USER: cstar
      POSTGRES_PASSWORD: cstar123
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cstar -d cstar"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:4
    container_name: cstar-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
