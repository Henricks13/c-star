spring:
  application:
    name: c-star-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/cstar}
    username: ${DB_USER:cstar}
    password: ${DB_PASSWORD:cstar123}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  security:
    jwt-secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-1234567890}
    jwt-expiration-minutes: ${JWT_EXP_MIN:60}
  multi-tenancy:
    enabled: ${MULTI_TENANCY_ENABLED:false}
    strategy: ${MULTI_TENANCY_STRATEGY:schema}

server:
  port: ${PORT:8080}
