databaseChangeLog:
  - changeSet:
      id: 001-create-platform-settings
      author: cstar
      changes:
        - createTable:
            tableName: platform_settings
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: setting_key
                  type: VARCHAR(120)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: setting_value
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
  - changeSet:
      id: 002-insert-shell-settings
      author: cstar
      changes:
        - insert:
            tableName: platform_settings
            columns:
              - column:
                  name: id
                  value: 11111111-1111-4111-8111-111111111111
              - column:
                  name: setting_key
                  value: app.mode
              - column:
                  name: setting_value
                  value: white-label-ready
