              - column: { name: email, value: carol@gmail.com }
              - column: { name: full_name, value: Dra. Carol Pinheiro }
              - column: { name: password_hash, value: "$2a$10$c2AuU8wiK4q4oLKYfd.lTOqrNTMmhKqfDBdeNq.wIOWLpE1trXIny" }
              - column: { name: enabled, valueBoolean: true }
              - column: { name: must_change_password, valueBoolean: false }
        - sql:
