databaseChangeLog:
  - changeSet:
      id: 015-create-clients
      author: cstar
      changes:
        - createTable:
            tableName: clients
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: full_name
                  type: VARCHAR(160)
                  constraints:
                    nullable: false
              - column:
                  name: phone_e164
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: cpf
                  type: VARCHAR(14)
              - column:
                  name: email
                  type: VARCHAR(160)
              - column:
                  name: origin
                  type: VARCHAR(40)
                  constraints:
                    nullable: false
              - column:
                  name: source_contact_id
                  type: UUID
              - column:
                  name: notes
                  type: VARCHAR(500)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: clients
            baseColumnNames: source_contact_id
            referencedTableName: contacts
            referencedColumnNames: id
            constraintName: fk_clients_source_contact
            onDelete: SET NULL

        - addUniqueConstraint:
            tableName: clients
            columnNames: cpf
            constraintName: uk_clients_cpf

        - addUniqueConstraint:
            tableName: clients
            columnNames: email
            constraintName: uk_clients_email

        - createIndex:
            tableName: clients
            indexName: idx_clients_origin
            columns:
              - column:
                  name: origin

        - createIndex:
            tableName: clients
            indexName: idx_clients_source_contact
            columns:
              - column:
                  name: source_contact_id

        - sql:
            sql: |
              ALTER TABLE clients
              ADD CONSTRAINT ck_clients_origin
              CHECK (origin IN ('RESGATE', 'CADASTRO_MANUAL', 'CADASTRO_INDICADO', 'OUTROS'));
