databaseChangeLog:
  - changeSet:
      id: 066-collaborators-goals
      author: cstar
      changes:
        - createTable:
            tableName: collaborator_daily_goals
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: goal_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: target_contacts
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: created_by_user_id
                  type: UUID
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: collaborator_daily_goals
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            onDelete: CASCADE
            constraintName: fk_collab_daily_goals_user
        - addForeignKeyConstraint:
            baseTableName: collaborator_daily_goals
            baseColumnNames: created_by_user_id
            referencedTableName: users
            referencedColumnNames: id
            onDelete: SET NULL
            constraintName: fk_collab_daily_goals_created_by
        - addUniqueConstraint:
            tableName: collaborator_daily_goals
            columnNames: user_id, goal_date
            constraintName: uk_collab_daily_goals_user_date
        - createIndex:
            indexName: idx_collab_daily_goals_date
            tableName: collaborator_daily_goals
            columns:
              - column:
                  name: goal_date

  - changeSet:
      id: 067-collaborators-tasks
      author: cstar
      changes:
        - createTable:
            tableName: collaborator_daily_tasks
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: task_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(220)
                  constraints:
                    nullable: false
              - column:
                  name: completed
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: created_by_user_id
                  type: UUID
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: collaborator_daily_tasks
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            onDelete: CASCADE
            constraintName: fk_collab_daily_tasks_user
        - addForeignKeyConstraint:
            baseTableName: collaborator_daily_tasks
            baseColumnNames: created_by_user_id
            referencedTableName: users
            referencedColumnNames: id
            onDelete: SET NULL
            constraintName: fk_collab_daily_tasks_created_by
        - createIndex:
            indexName: idx_collab_daily_tasks_user_date
            tableName: collaborator_daily_tasks
            columns:
              - column:
                  name: user_id
              - column:
                  name: task_date

  - changeSet:
      id: 068-collaborators-progress
      author: cstar
      changes:
        - createTable:
            tableName: collaborator_daily_progress
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: progress_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: answered_contacts_count
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: collaborator_daily_progress
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            onDelete: CASCADE
            constraintName: fk_collab_daily_progress_user
        - addUniqueConstraint:
            tableName: collaborator_daily_progress
            columnNames: user_id, progress_date
            constraintName: uk_collab_daily_progress_user_date
        - createIndex:
            indexName: idx_collab_daily_progress_date
            tableName: collaborator_daily_progress
            columns:
              - column:
                  name: progress_date
