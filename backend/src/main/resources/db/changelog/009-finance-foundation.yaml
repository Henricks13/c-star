databaseChangeLog:
  - changeSet:
      id: 024-create-finance-income-types
      author: cstar
      changes:
        - createTable:
            tableName: finance_income_types
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(120)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: description
                  type: VARCHAR(400)
              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

  - changeSet:
      id: 025-create-finance-expense-types
      author: cstar
      changes:
        - createTable:
            tableName: finance_expense_types
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(120)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: description
                  type: VARCHAR(400)
              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

  - changeSet:
      id: 026-create-finance-incomes
      author: cstar
      changes:
        - createTable:
            tableName: finance_incomes
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: income_type_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: source
                  type: VARCHAR(40)
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: DECIMAL(15,2)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(240)
              - column:
                  name: notes
                  type: VARCHAR(500)
              - column:
                  name: occurred_on
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: reference_id
                  type: UUID
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: finance_incomes
            baseColumnNames: income_type_id
            referencedTableName: finance_income_types
            referencedColumnNames: id
            constraintName: fk_finance_incomes_type
            onDelete: RESTRICT

        - createIndex:
            tableName: finance_incomes
            indexName: idx_finance_incomes_occurred_on
            columns:
              - column:
                  name: occurred_on

        - createIndex:
            tableName: finance_incomes
            indexName: idx_finance_incomes_source
            columns:
              - column:
                  name: source

        - sql:
            sql: |
              ALTER TABLE finance_incomes
              ADD CONSTRAINT ck_finance_incomes_source
              CHECK (source IN ('MANUAL', 'PRODUCT_SALE', 'SERVICE_ORDER'));

        - sql:
            sql: |
              ALTER TABLE finance_incomes
              ADD CONSTRAINT ck_finance_incomes_amount_non_negative
              CHECK (amount >= 0);

