  - changeSet:
      id: 028-create-product-sales
      author: cstar
      changes:
        - createTable:
            tableName: product_sales
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: customer_name
                  type: VARCHAR(160)
              - column:
                  name: notes
                  type: VARCHAR(500)
              - column:
                  name: occurred_on
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: total_amount
                  type: DECIMAL(15,2)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - createIndex:
            tableName: product_sales
            indexName: idx_product_sales_occurred_on
            columns:
              - column:
                  name: occurred_on

        - sql:
            sql: |
              ALTER TABLE product_sales
              ADD CONSTRAINT ck_product_sales_total_non_negative
              CHECK (total_amount >= 0);

  - changeSet:
      id: 029-create-product-sale-items
      author: cstar
      changes:
        - createTable:
            tableName: product_sale_items
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: sale_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: product_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: product_name_snapshot
                  type: VARCHAR(160)
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: DECIMAL(15,3)
                  constraints:
                    nullable: false
              - column:
                  name: unit_price
                  type: DECIMAL(15,2)
                  constraints:
                    nullable: false
              - column:
                  name: line_total
                  type: DECIMAL(15,2)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: product_sale_items
            baseColumnNames: sale_id
            referencedTableName: product_sales
            referencedColumnNames: id
            constraintName: fk_product_sale_items_sale
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: product_sale_items
            baseColumnNames: product_id
            referencedTableName: products
            referencedColumnNames: id
            constraintName: fk_product_sale_items_product
            onDelete: RESTRICT

        - createIndex:
            tableName: product_sale_items
            indexName: idx_product_sale_items_sale
            columns:
              - column:
                  name: sale_id

        - sql:
            sql: |
              ALTER TABLE product_sale_items
              ADD CONSTRAINT ck_product_sale_items_qty_positive
              CHECK (quantity > 0);

        - sql:
            sql: |
              ALTER TABLE product_sale_items
              ADD CONSTRAINT ck_product_sale_items_unit_non_negative
              CHECK (unit_price >= 0);

        - sql:
            sql: |
              ALTER TABLE product_sale_items
              ADD CONSTRAINT ck_product_sale_items_line_non_negative
              CHECK (line_total >= 0);
