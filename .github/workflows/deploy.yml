name: Deploy Server

on:
  workflow_dispatch:
  push:
    branches: ["homolog"]

concurrency:
  group: deploy-homolog
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -euxo pipefail
            echo "Deploy user: $(whoami)"
            mkdir -p ${{ secrets.DEPLOY_PATH }}
            sudo chown -R $(whoami):$(whoami) ${{ secrets.DEPLOY_PATH }} || true
            git config --global --add safe.directory ${{ secrets.DEPLOY_PATH }} || true
            if [ ! -d "${{ secrets.DEPLOY_PATH }}/.git" ]; then
              git clone --branch homolog https://github.com/${{ github.repository }}.git ${{ secrets.DEPLOY_PATH }}
            fi
            cd ${{ secrets.DEPLOY_PATH }}
            git fetch origin
            git checkout homolog
            git reset --hard ${{ github.sha }}
            if [ ! -f infra/.env.server ]; then
              echo "Arquivo infra/.env.server não encontrado no servidor."
              exit 1
            fi
            bash infra/scripts/deploy-ec2.sh ${{ secrets.DEPLOY_PATH }}
