name: Deploy Server

on:
  workflow_dispatch:
  push:
    branches: ["homolog"]

concurrency:
  group: deploy-homolog
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, cstar-homolog]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run deploy on self-hosted server
        run: |
          set -euo pipefail
          DEPLOY_PATH="/opt/c-star"

          sudo mkdir -p "$DEPLOY_PATH"
          sudo chown -R "$USER":"$USER" "$DEPLOY_PATH"
          git config --global --add safe.directory "$DEPLOY_PATH" || true

          if [ ! -d "$DEPLOY_PATH/.git" ]; then
            git clone --branch homolog "https://github.com/${GITHUB_REPOSITORY}.git" "$DEPLOY_PATH"
          fi

          cd "$DEPLOY_PATH"
          git fetch origin
          git checkout homolog
          git reset --hard "$GITHUB_SHA"

          if [ ! -f infra/.env.server ]; then
            echo "Arquivo infra/.env.server não encontrado no servidor."
            exit 1
          fi

          bash infra/scripts/deploy-ec2.sh "$DEPLOY_PATH"
