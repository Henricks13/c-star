name: Deploy Server

on:
  workflow_dispatch:
  push:
    branches: ["homolog"]

concurrency:
  group: deploy-homolog
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload project to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "."
          target: ${{ secrets.DEPLOY_PATH }}
          rm: false
          overwrite: true
          strip_components: 0

      - name: Run deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            if [ ! -f infra/.env.server ]; then
              echo "Arquivo infra/.env.server não encontrado no servidor."
              exit 1
            fi
            bash infra/scripts/deploy-ec2.sh ${{ secrets.DEPLOY_PATH }}
