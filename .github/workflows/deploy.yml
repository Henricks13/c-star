name: Deploy Server

on:
  workflow_dispatch:
  push:
    branches: ["homolog"]

concurrency:
  group: deploy-homolog
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_PATH: /opt/c-star

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            bash -lc '
              set -euo pipefail
              echo "Deploy user: $(whoami)"
              mkdir -p $DEPLOY_PATH
              git config --global --add safe.directory $DEPLOY_PATH || true
              if [ ! -d "$DEPLOY_PATH/.git" ]; then
                git clone --branch homolog https://github.com/${{ github.repository }}.git $DEPLOY_PATH
              fi
              cd $DEPLOY_PATH
              git fetch origin
              git checkout homolog
              git reset --hard ${{ github.sha }}
              if [ ! -f infra/.env.server ]; then
                echo "Arquivo infra/.env.server não encontrado no servidor."
                exit 1
              fi
              bash infra/scripts/deploy-ec2.sh $DEPLOY_PATH
            '
