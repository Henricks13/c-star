<div class="row">
  <div class="col-12">
    <app-card cardTitle="Tipos de Receita">
      <div class="types-toolbar mb-3">
        <button class="btn btn-sm btn-primary" type="button" (click)="openCreateModal()">
          <i class="ti ti-plus me-1"></i>
          Cadastrar
        </button>
      </div>

      <ng-container *ngIf="errorMessage">
        <div class="alert alert-danger" role="alert">{{ errorMessage }}</div>
      </ng-container>

      <ng-container *ngIf="infoMessage">
        <div class="alert alert-info" role="alert">{{ infoMessage }}</div>
      </ng-container>

      <ng-container *ngIf="loading">
        <p class="mb-0">Carregando tipos de receita...</p>
      </ng-container>

      <ng-container *ngIf="!loading && types.length === 0">
        <div class="empty-state">
          <p class="mb-2">Nenhum tipo de receita cadastrado.</p>
          <small class="text-muted">Cadastre tipos para classificar as receitas.</small>
        </div>
      </ng-container>

      <ng-container *ngIf="!loading && types.length > 0">
        <div class="table-responsive types-table-wrapper">
          <table class="table table-hover align-middle types-table mb-0">
            <thead class="types-thead">
              <tr>
                <th>Nome</th>
                <th>Descrição</th>
                <th class="text-end">Ações</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let type of types">
                <td>{{ type.name }}</td>
                <td>{{ type.description || '—' }}</td>
                <td>
                  <div class="type-actions">
                    <button class="btn btn-sm btn-outline-primary" type="button" (click)="openEditModal(type)">
                      <i class="ti ti-pencil"></i>
                    </button>
                    <button class="btn btn-sm btn-outline-danger" type="button" (click)="deleteType(type)">
                      <i class="ti ti-trash"></i>
                    </button>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </ng-container>
    </app-card>
  </div>
</div>

<ng-container *ngIf="createModalOpen">
  <div class="types-modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="create-income-type-title">
    <div class="types-modal">
      <h6 id="create-income-type-title" class="mb-3">Cadastrar tipo de receita</h6>

      <div class="d-flex flex-column gap-2">
        <div>
          <label class="form-label" for="incomeTypeName">Nome</label>
          <input id="incomeTypeName" class="form-control" [(ngModel)]="createForm.name" />
        </div>
        <div>
          <label class="form-label" for="incomeTypeDescription">Descrição (opcional)</label>
          <textarea id="incomeTypeDescription" class="form-control" rows="2" [(ngModel)]="createForm.description"></textarea>
        </div>
      </div>

      <div class="d-flex justify-content-end gap-2 mt-3">
        <button class="btn btn-outline-secondary" type="button" [disabled]="saving" (click)="closeCreateModal()">Cancelar</button>
        <button class="btn btn-primary" type="button" [disabled]="saving" (click)="createType()">Salvar</button>
      </div>
    </div>
  </div>
</ng-container>

<ng-container *ngIf="editModalOpen">
  <div class="types-modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="edit-income-type-title">
    <div class="types-modal">
      <h6 id="edit-income-type-title" class="mb-3">Editar tipo de receita</h6>

      <div class="d-flex flex-column gap-2">
        <div>
          <label class="form-label" for="editIncomeTypeName">Nome</label>
          <input id="editIncomeTypeName" class="form-control" [(ngModel)]="editForm.name" />
        </div>
        <div>
          <label class="form-label" for="editIncomeTypeDescription">Descrição (opcional)</label>
          <textarea id="editIncomeTypeDescription" class="form-control" rows="2" [(ngModel)]="editForm.description"></textarea>
        </div>
      </div>

      <div class="d-flex justify-content-end gap-2 mt-3">
        <button class="btn btn-outline-secondary" type="button" [disabled]="saving" (click)="closeEditModal()">Cancelar</button>
        <button class="btn btn-primary" type="button" [disabled]="saving" (click)="updateType()">Salvar</button>
      </div>
    </div>
  </div>
</ng-container>
