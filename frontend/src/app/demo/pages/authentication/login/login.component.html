<div class="auth-main">
  <div class="auth-wrapper v3">
    <div class="auth-form">
      <div class="card my-5">
        <div class="card-body">
          <form (ngSubmit)="onSubmit($event)">
            <a href="#" class="d-flex justify-content-center">
              <img src="assets/images/logo-dark.svg" alt="logo" />
            </a>
            <div class="row">
              <div class="d-flex justify-content-center">
                <div class="auth-header">
                  <h2 class="text-secondary mt-5"><b>Bem vindo(a) ao Sistema C-Star</b></h2>
                  <p class="fs-4 mt-2">Acesse sua conta para continuar</p>
                </div>
              </div>
            </div>
            <div class="d-grid">
              <button type="button" class="btn mt-2 btn-light-primary bg-light text-muted">
                <img src="assets/images/authentication/google-icon.svg" alt="google" />
                Entrar com Google
              </button>
            </div>
            <div class="saprator mt-3">
              <span>ou</span>
            </div>
            <h5 class="my-4 d-flex justify-content-center">Entrar com e-mail</h5>
            <div class="form-floating mb-3">
              <input
                type="email"
                class="form-control"
                id="floatingInput"
                placeholder="Seu e-mail"
                name="email"
                [ngModel]="loginModal().email"
                (ngModelChange)="updateLoginField('email', $event)"
              />
              <label for="floatingInput">E-mail</label>
            </div>
            <div class="form-floating mb-3">
              <input
                type="password"
                id="password"
                class="form-control"
                placeholder="Senha (mín. 8 caracteres)"
                name="password"
                [ngModel]="loginModal().password"
                (ngModelChange)="updateLoginField('password', $event)"
              />
              <label for="password">Senha</label>
            </div>
            <div class="d-flex mt-1 justify-content-between">
              <div class="form-check form-switch system-status-switch">
                <input
                  class="form-check-input system-status-switch-control"
                  type="checkbox"
                  id="customCheckc1"
                  [checked]="rememberMe()"
                  (change)="rememberMe.set($any($event.target).checked)"
                />
                <label class="form-check-label text-muted" for="customCheckc1">Lembrar de mim</label>
              </div>
              <h5 class="text-secondary">
                <a href="javascript:">Esqueci minha senha</a>
              </h5>
            </div>
            @if (error()) {
              <div class="alert alert-danger" role="alert">
                {{ error() }}
              </div>
            }
            <div class="d-grid mt-4">
              <button type="submit" class="btn btn-secondary" [disabled]="loading()">
                @if (loading()) {
                  Entrando...
                } @else {
                  Entrar
                }
              </button>
            </div>
            <hr />
            <h5 class="d-flex justify-content-center">
              <a [routerLink]="['/register']">Ainda não tem conta?</a>
            </h5>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
