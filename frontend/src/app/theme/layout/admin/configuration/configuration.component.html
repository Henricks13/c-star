<div id="styleSelector" class="menu-styler" [ngClass]="{ open: styleSelectorToggle }">
  <div class="pct-c-btn" ngbTooltip="Tema">
    <a href="javascript:" (click)="styleSelectorToggle = !styleSelectorToggle">
      <i class="ph-duotone ph-gear-six"></i>
    </a>
  </div>
  <div class="style-block">
    <div class="customize-header">
      <h5>Tema</h5>
      <div class="d-inline-flex align-items-center gap-2">
        <button type="button" class="btn-close ms-1" aria-label="Close" (click)="styleSelectorToggle = !styleSelectorToggle"></button>
      </div>
    </div>
    <ul class="list-group list-group-flush">
      <li class="list-group-item">
        <h5 class="mb-1 text-uppercase">Modo de visualização</h5>
        <p class="text-muted text-sm">Automático: claro entre 06:30 e 18:30, escuro fora desse horário. Se você escolher um modo, ele será mantido neste navegador.</p>
        <div class="theme-color">
          <div class="form-check">
            <input class="form-check-input" type="radio" name="theme_mode" id="themelight" [checked]="themeMode === 'light'" (click)="setTheme('light')" />
            <label class="form-check-label" for="themelight">Claro</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="theme_mode" id="themedark" [checked]="themeMode === 'dark'" (click)="setTheme('dark')" />
            <label class="form-check-label" for="themedark">Escuro</label>
          </div>
        </div>
      </li>
    </ul>
  </div>
</div>
