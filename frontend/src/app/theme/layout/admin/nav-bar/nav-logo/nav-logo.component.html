<div class="m-header" [ngClass]="{ 'is-collapsed': navCollapsed }">
  <a (click)="returnToHome()" class="b-brand" [ngClass]="{ 'is-collapsed': navCollapsed }">
    <img [src]="logoPath" alt="Logo Dra." class="brand-logo" />
  </a>
  <!-- ======= Menu collapse Icon ===== -->
  <div class="pc-h-item">
    <a
      href="javascript:"
      class="pc-head-link head-link-secondary m-0 mobile-menu"
      [ngClass]="{ on: navCollapsed }"
      id="sidebar-hide mobile-collapse"
      (click)="navCollapse()"
      title="Click to Menu Collapse"
    >
      <i class="ti ti-menu-2"></i>
    </a>
  </div>
</div>
